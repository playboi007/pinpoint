include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Inspector and binding entry points the plan relies on are protected or
    # test-only (see docs/api-notes.md). Using them needs an explicit ignore.
    invalid_use_of_protected_member: error
    invalid_use_of_visible_for_testing_member: error
    missing_required_param: error
    missing_return: error
    unused_import: error
  exclude:
    - build/**
    - example/build/**
    - example/.dart_tool/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_in_for_each
    - prefer_final_locals
    - unawaited_futures
    - unnecessary_lambdas
