name: Flutter CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Flutter ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 3.38.0
            version: 3.38.0
          - label: stable
            version: ''
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - name: Check formatting
        if: matrix.label == '3.38.0'
        run: dart format --output=none --set-exit-if-changed bin lib test example/lib example/test
      - name: Analyze on minimum Flutter
        if: matrix.label == '3.38.0'
        run: flutter analyze --no-pub
      - name: Analyze on stable Flutter
        if: matrix.label == 'stable'
        # Flutter 3.38 requires the original Material import. Report its
        # deprecation while enforcing every other analyzer diagnostic.
        run: |
          dart analyze --format=machine > "$RUNNER_TEMP/analysis.txt" || status=$?
          cat "$RUNNER_TEMP/analysis.txt"
          if [[ ${status:-0} -gt 1 ]]; then exit "$status"; fi
          awk -F'|' 'NF && !($1 == "INFO" && $3 == "DEPRECATED_MEMBER_USE" && index($8, "package:flutter/material.dart") && index($8, "package:material_ui/material_ui.dart")) { failed = 1 } END { exit failed }' "$RUNNER_TEMP/analysis.txt"
      - run: flutter test --no-pub --concurrency=1
      - run: flutter test --no-pub --concurrency=1
        working-directory: example
      - name: Run browser tests
        run: flutter test --no-pub --platform chrome test/overlay/construction/web test/tape/web test/theme/palette_store_web_test.dart test/trace/web
      - run: flutter build web --release --no-pub
        working-directory: example
