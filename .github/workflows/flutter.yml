name: Flutter CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Flutter ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 3.38.0
            version: 3.38.0
          - label: stable
            version: ''
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.version }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - name: Check formatting
        if: matrix.label == '3.38.0'
        run: dart format --output=none --set-exit-if-changed bin lib test example/lib example/test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter test --no-pub
        working-directory: example
      - run: flutter build web --release --no-pub
        working-directory: example
